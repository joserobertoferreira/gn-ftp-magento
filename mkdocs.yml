site_name: GN · FTP Magento
site_description: Integração Sage X3 ↔ Magento via SFTP (stocks, códigos de barras, emails de satisfação, encomendas e devoluções)
site_author: José Roberto Ferreira
copyright: Copyright &copy; 2025 José Roberto Ferreira

# A porta 8000 (predefinida) está reservada pelo Windows (excludedportrange).
dev_addr: 127.0.0.1:8765

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Início: index.md
  - Guia:
      - Instalação: guia/instalacao.md
      - Configuração: guia/configuracao.md
      - Execução e operação: guia/operacao.md
  - Funcionamento:
      - Arquitetura: funcionamento/arquitetura.md
      - Sincronização de stocks: funcionamento/stocks.md
      - Códigos de barras: funcionamento/codigos-barras.md
      - Emails de satisfação: funcionamento/emails.md
      - Envio de ficheiros (X3 → Magento): funcionamento/envio.md
      - Receção de ficheiros (Magento → X3): funcionamento/rececao.md
      - Agendamento: funcionamento/agendamento.md
  - Referência da API:
      - referencia/index.md
      - main: referencia/main.md
      - app.config: referencia/config.md
      - app.database: referencia/database.md
      - app.ftp: referencia/ftp.md
      - app.scheduler: referencia/scheduler.md
      - app.services: referencia/services.md
  - Análise técnica: analise-tecnica.md

theme:
  name: material
  language: pt
  icon:
    logo: material/swap-horizontal-bold
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro

plugins:
  - search:
      lang: pt
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: sphinx
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            filters: []
            show_if_no_docstring: true
            merge_init_into_class: true
            heading_level: 2

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
